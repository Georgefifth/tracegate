  <text x="560" y="300" fill="#BE123C" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="600">✗ felixkrones/ECG-Digitiser (#22)</text>
  <text x="560" y="328" fill="#4F5D65" font-family="IBM Plex Sans, sans-serif" font-size="16">Git LFS quota exceeded; nnUNet GPU lock</text>
  <text x="560" y="368" fill="#BE123C" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="600">✗ Open-ECG-Digitizer (#48)</text>
