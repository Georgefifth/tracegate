  <text x="1062" y="464" fill="#F59E0B" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="700">Argmax Tier 4 SNR: 3.47 dB</text>
  <text x="1062" y="492" fill="#FDA4AF" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="700">Argmax Tier 4 QT MAE: 81.3 ms</text>

