  <text x="88" y="260" fill="#11181C" font-family="IBM Plex Sans, sans-serif" font-size="22" font-weight="700">Thermal Printouts &amp; Photos</text>
  <text x="88" y="298" fill="#4F5D65" font-family="IBM Plex Sans, sans-serif" font-size="17">• 25 mm/s, 10 mm/mV terracotta grid</text>
  <text x="88" y="330" fill="#4F5D65" font-family="IBM Plex Sans, sans-serif" font-size="17">• Handheld skew (±4.5°) &amp; shadows</text>
  <text x="88" y="362" fill="#4F5D65" font-family="IBM Plex Sans, sans-serif" font-size="17">• 55% archival thermal ink fade</text>
  <text x="88" y="394" fill="#4F5D65" font-family="IBM Plex Sans, sans-serif" font-size="17">• Adjacent LVH lead R-wave collisions</text>
  <rect x="88" y="440" width="352" height="68" rx="6" fill="#F8F4EC" stroke="#D96B52" stroke-width="1.5" />
  <path d="M 104 484 L 130 484 L 130 456 L 146 456 L 146 484 L 180 484 L 192 448 L 202 496 L 212 484 L 245 484 Q 265 464 285 484 L 420 484" fill="none" stroke="#171E22" stroke-width="3" />

